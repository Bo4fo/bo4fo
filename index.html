<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Native form controls / scrollbars follow the system theme -->
  <meta name="color-scheme" content="light dark" />
  <!-- Apply the system light/dark setting before first paint (no flash). -->
  <script>
    (function () {
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function (e) { document.documentElement.classList.toggle('dark', e.matches); };
        apply(mq);
        mq.addEventListener('change', apply);
      } catch (_) { }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="./assets/images/bp.ico" />
  <link rel="icon" type="image/png" href="./assets/images/bp.png" />
  <link rel="apple-touch-icon" href="./assets/images/bp.png" />
  <title>Boafo Philip - Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
